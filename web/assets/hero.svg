<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440"><title>Software Factory — from a task to a reviewed pull request</title><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#285345" stroke-width=".7"/></pattern><linearGradient id="fade"><stop stop-color="#183F34"/><stop offset="1" stop-color="#0E2C25"/></linearGradient></defs><rect width="1280" height="440" rx="24" fill="url(#fade)"/><rect width="1280" height="440" rx="24" fill="url(#grid)"/><circle cx="1190" cy="50" r="190" fill="#D5EF83" opacity=".035"/><rect x="52" y="44" width="176" height="28" rx="14" fill="#315347"/><circle cx="69" cy="58" r="4" fill="#D5EF83"/><text x="83" y="62" fill="#D5EF83" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.7">SOFTWARE FACTORY</text><text x="52" y="136" fill="#F4F6EC" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.8">Good software.</text><text x="52" y="191" fill="#D5EF83" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.8">A repeatable process.</text><text x="54" y="232" fill="#B6C9BA" font-family="Arial,Helvetica,sans-serif" font-size="16">AI workers. Isolated worktrees. Evidence before handoff.</text><path d="M54 302h1172" stroke="#4A6B56" stroke-width="2" stroke-dasharray="4 7"/>
<g font-family="Arial,Helvetica,sans-serif"><g transform="translate(54 279)"><rect width="166" height="89" rx="12" fill="#244D3D" stroke="#496B55"/><circle cx="25" cy="24" r="12" fill="#365C45"/><text x="21" y="28" fill="#D5EF83" font-size="12">1</text><text x="17" y="60" fill="#F4F6EC" font-size="14">Define the task</text></g><g transform="translate(248 279)"><rect width="166" height="89" rx="12" fill="#244D3D" stroke="#496B55"/><path d="m18 22 6 5-6 5m12 0h8" fill="none" stroke="#D5EF83" stroke-width="2"/><text x="17" y="60" fill="#F4F6EC" font-size="14">Build in isolation</text></g><g transform="translate(442 279)"><rect width="166" height="89" rx="12" fill="#244D3D" stroke="#496B55"/><path d="m18 25 5 5 10-12" fill="none" stroke="#D5EF83" stroke-width="2"/><text x="17" y="60" fill="#F4F6EC" font-size="14">Validate with CI</text></g><g transform="translate(636 279)"><rect width="166" height="89" rx="12" fill="#244D3D" stroke="#496B55"/><circle cx="25" cy="24" r="7" fill="none" stroke="#D5EF83" stroke-width="2"/><path d="m30 30 6 6" stroke="#D5EF83" stroke-width="2"/><text x="17" y="60" fill="#F4F6EC" font-size="14">Review &amp; repair</text></g><g transform="translate(830 279)"><rect width="166" height="89" rx="12" fill="#244D3D" stroke="#496B55"/><path d="m25 15 10 4v7c0 6-10 11-10 11s-10-5-10-11v-7l10-4Z" fill="none" stroke="#D5EF83" stroke-width="1.7"/><text x="17" y="60" fill="#F4F6EC" font-size="14">Check the evidence</text></g><g transform="translate(1024 279)"><rect width="202" height="89" rx="12" fill="#D5EF83"/><path d="m18 24 5 5 11-12" fill="none" stroke="#173E34" stroke-width="2.5"/><text x="17" y="60" fill="#173E34" font-size="14" font-weight="700">Handoff a reviewed PR</text></g><text x="54" y="406" fill="#92AC9A" font-size="10" letter-spacing="1.6">POWERED BY AGENT ORCHESTRATOR</text><text x="973" y="406" fill="#92AC9A" font-size="10" letter-spacing="1.6">LOCAL FIRST · HUMAN REVIEW</text></g></svg>
