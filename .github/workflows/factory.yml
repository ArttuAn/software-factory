name: Factory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  factory-tests:
    name: Factory tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest -v test_factory
      - run: python3 -m py_compile factory.py bootstrap.py
      - run: node --check web/app.js
